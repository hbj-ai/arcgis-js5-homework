<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌌 极光风暴：全球地震与地磁活动可视化平台（必显底图版）</title>
    <!-- Leaflet 核心资源 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; 
            background: #0f1419;
            color: #e0e0e0;
        }
        
        /* ========= 三区域布局 ========= */
        .app { 
            display: flex; 
            height: 100%; 
            position: relative;
        }
        
        /* 区域一：侧边栏（底图+工具） */
        .sidebar {
            width: 200px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 1000;
            border-right: 1px solid rgba(94, 234, 212, 0.2);
        }
        
        .sidebar-section {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: #5eead4;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .basemap-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .basemap-item {
            padding: 8px 12px;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            border: 1px solid transparent;
        }
        
        .basemap-item:hover {
            background: rgba(94, 234, 212, 0.1);
            border-color: #5eead4;
        }
        
        .basemap-item.active {
            background: rgba(94, 234, 212, 0.2);
            border-color: #5eead4;
            color: #5eead4;
        }
        
        .tool-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .tool-item {
            padding: 8px 12px;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .tool-item:hover {
            background: rgba(94, 234, 212, 0.1);
        }
        
        /* 区域二：地图区域 */
        .map-area {
            flex: 1;
            position: relative;
        }
        
        #map {
            width: 100%;
            height: 100%;
            background: #0f172a;
        }
        
        /* 微件：搜索框 */
        .search-widget {
            position: absolute;
            top: 20px;
            left: 230px;
            z-index: 1000;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-radius: 30px;
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(94, 234, 212, 0.2);
        }
        
        .search-widget input {
            background: transparent;
            border: none;
            color: #e0e0e0;
            padding: 8px;
            width: 200px;
            outline: none;
            font-size: 14px;
        }
        
        .search-widget button {
            background: #5eead4;
            border: none;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        
        .search-widget button:hover {
            background: #2dd4bf;
        }
        
        /* 微件：图层控制 */
        .layer-control {
            position: absolute;
            top: 80px;
            left: 230px;
            z-index: 1000;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(94, 234, 212, 0.2);
            width: 220px;
        }
        
        .layer-control h4 {
            font-size: 14px;
            color: #5eead4;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .layer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            font-size: 13px;
        }
        
        .layer-item input {
            cursor: pointer;
        }
        
        /* 微件：图例 */
        .legend-widget {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(94, 234, 212, 0.2);
            width: 200px;
        }
        
        .legend-widget h4 {
            font-size: 14px;
            color: #5eead4;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
            font-size: 12px;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        
        /* 微件：比例尺 */
        .scale-widget {
            position: absolute;
            bottom: 20px;
            left: 230px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
            backdrop-filter: blur(4px);
        }
        
        /* 极光背景（Canvas 模拟） */
        #aurora-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 15px 5px;
            }
            .sidebar-title, .basemap-item span, .tool-item span {
                display: none;
            }
            .search-widget {
                left: 80px;
                top: 10px;
            }
            .search-widget input {
                width: 120px;
            }
            .layer-control {
                left: 80px;
                top: 60px;
                width: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 侧边栏：底图+工具 -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">🗺️ 底图库（点击切换）</div>
                <div class="basemap-list">
                    <div class="basemap-item active" data-basemap="gaode-vector">高德矢量</div>
                    <div class="basemap-item" data-basemap="gaode-sat">高德卫星</div>
                    <div class="basemap-item" data-basemap="tencent-vector">腾讯矢量</div>
                    <div class="basemap-item" data-basemap="osm">OpenStreetMap</div>
                    <div class="basemap-item" data-basemap="stamen-terrain">Stamen 地形</div>
                    <div class="basemap-item" data-basemap="nasa-sat">NASA 卫星</div>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">⚙️ 工具</div>
                <div class="tool-list">
                    <div class="tool-item" id="reset-view">🔄 重置视图</div>
                    <div class="tool-item" id="toggle-aurora">🌌 极光背景</div>
                </div>
            </div>
        </div>
        
        <!-- 地图区域 -->
        <div class="map-area">
            <canvas id="aurora-canvas"></canvas> <!-- 极光背景 -->
            <div id="map"></div>
            
            <!-- 搜索框 -->
            <div class="search-widget">
                <input type="text" id="search-input" placeholder="搜索地点，例如：北京、上海" />
                <button id="search-btn">搜索</button>
            </div>
            
            <!-- 图层控制 -->
            <div class="layer-control">
                <h4>📁 图层控制</h4>
                <div class="layer-item">
                    <input type="checkbox" id="earthquake-layer" checked>
                    <label for="earthquake-layer">🌋 全球地震专题图层（模拟数据）</label>
                </div>
                <div class="layer-item">
                    <input type="checkbox" id="aurora-layer" checked>
                    <label for="aurora-layer">🌌 极光风暴底图</label>
                </div>
                <div class="layer-item">
                    <input type="checkbox" id="geomagnetic-layer" checked>
                    <label for="geomagnetic-layer">🧲 地磁异常热力图（模拟）</label>
                </div>
            </div>
            
            <!-- 图例 -->
            <div class="legend-widget">
                <h4>📖 图例 - 地震震级与地磁强度</h4>
                <div class="legend-item">
                    <div class="legend-color" style="background: #90ee90;"></div>
                    <span>2.5 - 3.5 级 (小震)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffc107;"></div>
                    <span>3.5 - 5.0 级 (中震)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff4500;"></div>
                    <span>5.0 - 7.5+ 级 (强震)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #00ffff;"></div>
                    <span>地磁异常强度</span>
                </div>
            </div>
            
            <!-- 比例尺 -->
            <div class="scale-widget" id="scale-bar">📏 比例尺: 计算中...</div>
        </div>
    </div>

    <script>
        // ========= 1. 底图配置（国内可访问，含兜底） =========
        const basemaps = {
            'gaode-vector': L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
                subdomains: '1234', 
                attribution: '高德地图',
                maxZoom: 19
            }).on('tileerror', (e) => {
                console.warn('高德矢量底图加载失败，切换备用源');
                e.target.setUrl('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
            }),
            'gaode-sat': L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
                subdomains: '1234', 
                attribution: '高德卫星',
                maxZoom: 19
            }).on('tileerror', (e) => {
                console.warn('高德卫星底图加载失败，切换备用源');
                e.target.setUrl('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
            }),
            'tencent-vector': L.tileLayer('https://rt{s}.map.gtimg.com/realtimerender?z={z}&x={x}&y={y}&type=vector&style=1', {
                subdomains: '0123', 
                attribution: '腾讯地图',
                maxZoom: 19
            }).on('tileerror', (e) => {
                console.warn('腾讯矢量底图加载失败，切换备用源');
                e.target.setUrl('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
            }),
            'osm': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: 'OpenStreetMap',
                maxZoom: 19
            }),
            'stamen-terrain': L.tileLayer('https://stamen-tiles.a.ssl.fastly.net/terrain/{z}/{x}/{y}.jpg', {
                attribution: 'Stamen Terrain',
                maxZoom: 18
            }).on('tileerror', (e) => {
                console.warn('Stamen地形底图加载失败，切换备用源');
                e.target.setUrl('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
            }),
            'nasa-sat': L.tileLayer('https://map1{s}.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                subdomains: '0123',
                attribution: 'NASA Satellite',
                maxZoom: 19
            }).on('tileerror', (e) => {
                console.warn('NASA卫星底图加载失败，切换备用源');
                e.target.setUrl('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
            })
        };
        
        // 初始化地图
        const map = L.map('map').setView([35.0, 108.0], 5);
        let currentBasemap = 'gaode-vector';
        basemaps[currentBasemap].addTo(map);
        
        // ========= 2. 极光背景（Canvas 动态绘制） =========
        const auroraCanvas = document.getElementById('aurora-canvas');
        const ctx = auroraCanvas.getContext('2d');
        auroraCanvas.width = window.innerWidth;
        auroraCanvas.height = window.innerHeight;
        
        function drawAurora() {
            ctx.clearRect(0, 0, auroraCanvas.width, auroraCanvas.height);
            const gradient = ctx.createLinearGradient(0, 0, 0, auroraCanvas.height);
            gradient.addColorStop(0, 'rgba(94, 234, 212, 0.1)');
            gradient.addColorStop(0.5, 'rgba(168, 85, 247, 0.1)');
            gradient.addColorStop(1, 'rgba(236, 72, 153, 0.1)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(0, auroraCanvas.height);
            for (let x = 0; x < auroraCanvas.width; x += 20) {
                const y = auroraCanvas.height - Math.random() * 200 - 50;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(auroraCanvas.width, auroraCanvas.height);
            ctx.closePath();
            ctx.fill();
            
            requestAnimationFrame(drawAurora);
        }
        drawAurora();
        
        // ========= 3. 专题图层：地震（模拟数据） =========
        let earthquakeLayer = null;
        
        function loadEarthquakeData() {
            // 模拟地震数据（随机点）
            const features = [];
            for (let i = 0; i < 50; i++) {
                const lat = 20 + Math.random() * 50; // 20-70°N
                const lng = 70 + Math.random() * 80; // 70-150°E
                const mag = 2.5 + Math.random() * 5; // 2.5-7.5级
                features.push({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: [lng, lat] },
                    properties: { mag }
                });
            }
            
            const geoJson = {
                type: 'FeatureCollection',
                features
            };
            
            if (earthquakeLayer) map.removeLayer(earthquakeLayer);
            
            earthquakeLayer = L.geoJSON(geoJson, {
                pointToLayer: function(feature, latlng) {
                    const mag = feature.properties.mag;
                    let size = Math.min(28, 5 + mag * 2.2);
                    let color = '#90ee90';
                    if (mag >= 5) color = '#ff4500';
                    else if (mag >= 3.5) color = '#ffc107';
                    
                    return L.circleMarker(latlng, {
                        radius: size,
                        fillColor: color,
                        color: '#ffffff',
                        weight: 1.2,
                        opacity: 1,
                        fillOpacity: 0.75
                    });
                },
                onEachFeature: function(feature, layer) {
                    const mag = feature.properties.mag;
                    const place = `模拟地震点 (${mag.toFixed(1)}级)`;
                    layer.bindPopup(`
                        <b>🌋 地震事件</b>
                        📍 地点: ${place}
                        📊 震级: ${mag.toFixed(1)}
                    `);
                }
            });
            
            if (document.getElementById('earthquake-layer').checked) {
                earthquakeLayer.addTo(map);
            }
        }
        
        loadEarthquakeData();
        
        // ========= 4. 地磁热力图（模拟数据） =========
        let geomagneticLayer = null;
        
        function loadGeomagneticData() {
            // 模拟地磁数据（随机点）
            const features = [];
            for (let i = 0; i < 30; i++) {
                const lat = 20 + Math.random() * 50;
                const lng = 70 + Math.random() * 80;
                const intensity = Math.random(); // 0-1
                features.push({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: [lng, lat] },
                    properties: { intensity }
                });
            }
            
            const geoJson = {
                type: 'FeatureCollection',
                features
            };
            
            if (geomagneticLayer) map.removeLayer(geomagneticLayer);
            
            geomagneticLayer = L.geoJSON(geoJson, {
                pointToLayer: function(feature, latlng) {
                    const intensity = feature.properties.intensity;
                    let size = 5 + intensity * 15;
                    let color = `rgba(0, 255, 255, ${0.5 + intensity * 0.5})`;
                    
                    return L.circleMarker(latlng, {
                        radius: size,
                        fillColor: color,
                        color: '#00ffff',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.7
                    });
                },
                onEachFeature: function(feature, layer) {
                    const intensity = feature.properties.intensity;
                    layer.bindPopup(`
                        <b>🧲 地磁异常</b>
                        📊 强度: ${(intensity * 100).toFixed(1)}%
                    `);
                }
            });
            
            if (document.getElementById('geomagnetic-layer').checked) {
                geomagneticLayer.addTo(map);
            }
        }
        
        loadGeomagneticData();
        
        // ========= 5. 底图切换交互 =========
        const basemapItems = document.querySelectorAll('.basemap-item');
        function switchBasemap(type) {
            if (currentBasemap === type) return;
            Object.values(basemaps).forEach(layer => { 
                if (map.hasLayer(layer)) map.removeLayer(layer); 
            });
            basemaps[type].addTo(map);
            currentBasemap = type;
            
            basemapItems.forEach(item => {
                const val = item.getAttribute('data-basemap');
                if (val === type) item.classList.add('active');
                else item.classList.remove('active');
            });
            
            // 确保专题图层在最上层
            if (earthquakeLayer && document.getElementById('earthquake-layer').checked) {
                earthquakeLayer.bringToFront();
            }
            if (geomagneticLayer && document.getElementById('geomagnetic-layer').checked) {
                geomagneticLayer.bringToFront();
            }
        }
        
        basemapItems.forEach(item => {
            item.addEventListener('click', () => {
                const type = item.getAttribute('data-basemap');
                if (basemaps[type]) switchBasemap(type);
            });
        });
        
        // ========= 6. 搜索功能（模拟） =========
        const searchBtn = document.getElementById('search-btn');
        const searchInput = document.getElementById('search-input');
        
        function searchLocation(query) {
            if (!query.trim()) return;
            // 模拟搜索（随机定位到亚洲区域）
            const lat = 20 + Math.random() * 50;
            const lng = 70 + Math.random() * 80;
            map.setView([lat, lng], 10);
            L.popup().setLatLng([lat, lng]).setContent(`📍 模拟搜索结果：${query}`).openOn(map);
        }
        
        searchBtn.addEventListener('click', () => searchLocation(searchInput.value));
        searchInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') searchLocation(searchInput.value); 
        });
        
        // ========= 7. 图层控制交互 =========
        document.getElementById('earthquake-layer').addEventListener('change', (e) => {
            if (earthquakeLayer) {
                e.target.checked ? map.addLayer(earthquakeLayer) : map.removeLayer(earthquakeLayer);
            }
        });
        
        document.getElementById('aurora-layer').addEventListener('change', (e) => {
            auroraCanvas.style.display = e.target.checked ? 'block' : 'none';
        });
        
        document.getElementById('geomagnetic-layer').addEventListener('change', (e) => {
            if (geomagneticLayer) {
                e.target.checked ? map.addLayer(geomagneticLayer) : map.removeLayer(geomagneticLayer);
            }
        });
        
        // ========= 8. 重置视图 =========
        document.getElementById('reset-view').addEventListener('click', () => {
            map.setView([35.0, 108.0], 5);
        });
        
        // ========= 9. 极光背景开关 =========
        document.getElementById('toggle-aurora').addEventListener('click', (e) => {
            const isChecked = document.getElementById('aurora-layer').checked;
            document.getElementById('aurora-layer').checked = !isChecked;
            auroraCanvas.style.display = !isChecked ? 'block' : 'none';
            e.target.textContent = !isChecked ? '🌌 极光背景 (开)' : '🌌 极光背景 (关)';
        });
        
        // ========= 10. 比例尺动态更新 =========
        function updateScale() {
            const zoom = map.getZoom();
            const scaleText = `${Math.round(156543.03 * Math.cos(0) / Math.pow(2, zoom))}`;
            let distance = '';
            if (zoom >= 15) distance = '约 100 米';
            else if (zoom >= 13) distance = '约 500 米';
            else if (zoom >= 11) distance = '约 2 公里';
            else if (zoom >= 9) distance = '约 10 公里';
            else if (zoom >= 7) distance = '约 50 公里';
            else if (zoom >= 5) distance = '约 200 公里';
            else distance = '约 500+ 公里';
            document.getElementById('scale-bar').innerHTML = `📏 1 : ${scaleText} (${distance})`;
        }
        map.on('zoomend moveend', updateScale);
        updateScale();
        
        // ========= 11. 窗口resize适配 =========
        window.addEventListener('resize', () => {
            auroraCanvas.width = window.innerWidth;
            auroraCanvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
